apiVersion: veydeck.io/v1alpha1
kind: ComposeSuite
metadata:
  suiteId: veydeck.packet
  slug: packet
  version: 0.1.0-alpha.1
  name: 流量解析
  summary: 提供在线 PCAP 流量流式解析、协议字段级展示、流量统计图表，以及可视化自定义数据包构造与导出。
  icon: assets/suite-icon.png
  minVeydeckVersion: 0.1.0-alpha.1
  category: tools

compatibility:
  platformContractVersion: 1

runtime:
  type: compose
  composeFile: compose.yaml
  projectNameTemplate: veydeck-{slug}
  network:
    name: veydeck-suite-network
    external: true
  agent:
    services:
      - veydeck-packet
    capabilities:
      - operation-logs.write

services:
  - name: veydeck-packet
    role: web
    health:
      type: http
      path: /health
      port: 8080

appEntries:
  - id: main
    title: 流量解析
    type: proxied_web
    service: veydeck-packet
    port: 8080
    path: /
    window:
      width: 1200
      height: 780
      minWidth: 960
      minHeight: 640

i18n:
  defaultLocale: zh-CN
  locales:
    en-US:
      metadata:
        name: Traffic Analyzer
        summary: Stream-parse PCAP files, view detailed protocol layers, analyze traffic stats, and visually build/export custom packets.
      appEntries:
        main:
          title: Traffic Analyzer

permissions:
  network:
    outbound: true
  volumes:
    named: true
    hostPaths: []
  dangerous:
    privileged: false
    hostNetwork: false
    dockerSocket: false
